<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title data-i18n="export.windowTitle">エクスポート</title>
    <link rel="stylesheet" href="/src/export.css">
</head>

<body>
    <!-- ★ 全体を囲むラッパーを追加 -->
    <div id="export-wrapper">

        <!-- タイトルバー -->
        <div data-tauri-drag-region class="export-titlebar no-print">
            <div class="export-controls">
                <!-- 設定コントロールを追加 -->
                <select id="font-select" title="フォント" style="height: 22px;">
                    <option value="serif" data-i18n="export.fontSerif">明朝 (Serif)</option>
                    <option value="sans-serif" data-i18n="export.fontSans">ゴシック (Sans)</option>
                    <option value="monospace" data-i18n="export.fontMono">等幅</option>
                    <!-- 必要ならシステムフォントもここに追加 -->
                </select>

                <input type="number" id="font-size" value="16" min="8" max="72" title="フォントサイズ (px)"
                    style="width: 40px;">

                <label title="行間"><span style="color:white; font-size:0.8em;"></span>
                    <input type="number" id="line-height" value="1.8" min="1.0" max="3.0" step="0.1"
                        style="width: 40px;">
                </label>

                <span style="border-left: 1px solid #666; margin: 0 10px;"></span>

                <button id="btn-print" data-i18n-title="export.tooltip.print" title="印刷 / PDF保存(Ctrl+P)">🖨️</button>
                <button id="btn-docx" data-i18n-title="export.tooltip.docx" title="MS-Word (DOCX) 保存">DOCX</button>
                <button id="btn-html" data-i18n-title="export.tooltip.html" title="HTML保存">HTML</button>
                <button id="btn-epub" data-i18n-title="export.tooltip.epub" title="EPUB保存">EPUB</button>
                <button id="btn-close" data-i18n-title="export.tooltip.close" title="閉じる(Ctrl+E)">×</button>
            </div>
        </div>

        <!-- 原稿エリア -->
        <div id="print-container">
            <div id="paper-area">
                <div id="content"></div>
            </div>
        </div>
        <!-- EPUB設定モーダル -->
        <div id="epub-modal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <h3 data-i18n="export.epub.modalTitle">EPUB出力設定</h3>

                <div class="modal-item">
                    <label data-i18n="export.epub.title">タイトル:</label>
                    <input type="text" id="epub-title" data-i18n-placeholder="export.epub.titlePlaceholder"
                        placeholder="作品名">
                </div>

                <div class="modal-item">
                    <label data-i18n="export.epub.author">著者名:</label>
                    <input type="text" id="epub-author" data-i18n-placeholder="export.epub.authorPlaceholder"
                        placeholder="著者名" value="Author">
                </div>

                <div class="modal-item">
                    <label data-i18n="export.epub.cover">表紙画像 (任意):</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="epub-cover-path" readonly
                            data-i18n-placeholder="export.epub.coverUnselected" placeholder="未選択">
                        <button id="btn-select-cover" data-i18n="export.epub.select">選択</button>
                        <button id="btn-clear-cover">×</button>
                    </div>
                </div>

                <div class="modal-buttons">
                    <button id="btn-cancel-epub" data-i18n="export.epub.cancel">キャンセル</button>
                    <button id="btn-exec-epub" class="primary" data-i18n="export.epub.save">保存...</button>
                </div>
            </div>
        </div>
    </div>

    <!-- スクリプト (インライン推奨) -->
    <script type="module">
        import { listen, emit } from '@tauri-apps/api/event';
        import { invoke } from '@tauri-apps/api/core';
        import { getCurrentWindow } from '@tauri-apps/api/window';
        import { open, save } from '@tauri-apps/plugin-dialog';
        import updateArticle from '/src/scripts/ruby.ts';
        import { Store } from '@tauri-apps/plugin-store';
        import { initI18n, applyTranslationsToDOM, t } from '/src/i18n.ts';

        async function initExport() {
            const contentDiv = document.getElementById('content');
            const fontSelect = document.getElementById('font-select');
            const fontSizeInput = document.getElementById('font-size');
            const lineHeightInput = document.getElementById('line-height');
            const epubModal = document.getElementById('epub-modal');
            const epubTitleInput = document.getElementById('epub-title');
            const epubAuthorInput = document.getElementById('epub-author');
            const epubCoverPathInput = document.getElementById('epub-cover-path');
            let rawMarkdownText = "";

            const store = await Store.load('.settings.dat');
            const appLang = (await store.get('appLanguage')) ?? 'ja';
            await initI18n(appLang === 'en' ? 'en' : 'ja');
            applyTranslationsToDOM();
            const title = await invoke('get_window_title', { windowKey: 'export' }).catch(() => '');
            if (title) { await getCurrentWindow().setTitle(title); }

            // 言語変更同期
            listen('app:language-changed', async (event) => {
                await initI18n(event.payload === 'en' ? 'en' : 'ja');
                applyTranslationsToDOM();
                const newTitle = await invoke('get_window_title', { windowKey: 'export' }).catch(() => '');
                if (newTitle) { await getCurrentWindow().setTitle(newTitle); }
            });

            // データ受信
            await listen('export-data', (event) => {
                const { text } = event.payload;
                if (contentDiv) {
                    rawMarkdownText = text;
                    contentDiv.innerHTML = text.replace(/\n/g, '<br>');
                    updateArticle(contentDiv);
                    updateStyles();
                }
            });

            // --- スタイル更新関数 ---
            function updateStyles() {
                if (!contentDiv) return;
                const font = fontSelect.value;
                const size = fontSizeInput.value;
                const lh = lineHeightInput.value;

                contentDiv.style.fontFamily = font === 'serif'
                    ? '"Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", "Yu Mincho", serif'
                    : font === 'sans-serif'
                        ? '"Verdana", "Arial", "Helvetica", "Hiragino Sans", sans-serif'
                        : '"Menlo", "Monaco", "Consolas", monospace';
                contentDiv.style.fontSize = `${size}px`;
                contentDiv.style.lineHeight = lh;
            }

            // イベントリスナー
            fontSelect.addEventListener('change', updateStyles);
            fontSizeInput.addEventListener('input', updateStyles);
            lineHeightInput.addEventListener('input', updateStyles);

            // データ要求 (起動直後)
            setTimeout(() => emit('export-request-data'), 100);

            // --- 印刷 ---
            document.getElementById('btn-print')?.addEventListener('click', () => {
                window.print();
            });

            // --- HTML保存 ---
            document.getElementById('btn-html')?.addEventListener('click', async () => {
                const path = await save({ filters: [{ name: 'HTML', extensions: ['html'] }] });
                if (path && contentDiv) {
                    const currentFont = contentDiv.style.fontFamily;
                    const currentSize = contentDiv.style.fontSize;
                    const currentLineHeight = contentDiv.style.lineHeight;

                    const style = `
            <style>
                body {
                    background-color: #555;
                    margin: 0;
                    padding: 20px;
                    display: flex;
                    justify-content: center;
                }
                .paper {
                    background-color: white;
                    color: black;
                    width: 210mm;
                    min-height: 297mm;
                    padding: 20mm;
                    box-sizing: border-box;
                    margin: 0 auto;
                    box-shadow: 0 0 10px rgba(0,0,0,0.5);
                    font-family: ${currentFont};
                    font-size: ${currentSize};
                    line-height: ${currentLineHeight};
                    word-wrap: break-word;
                }
                @media print {
                    body { background: none; display: block; padding: 0; }
                    .paper { width: 100%; margin: 0; box-shadow: none; min-height: auto; }
                }
            </style>`;

                    const fullHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8">${style}</head><body><div class="paper">${contentDiv.innerHTML}</div></body></html>`;

                    await invoke('write_file', { path, content: fullHtml, encoding: 'UTF-8' });
                    alert(t('export.alert.saved'));
                }
            });

            // --- MS-Word (DOCX) 保存 ---
            document.getElementById('btn-docx')?.addEventListener('click', async () => {
                const text = rawMarkdownText;
                if (!text || !text.trim()) { alert(t('export.alert.noContent')); return; }

                const path = await save({
                    title: t('export.dialog.docxTitle'),
                    defaultPath: 'Untitled.docx',
                    filters: [{ name: 'Word Document', extensions: ['docx'] }]
                });

                if (path) {
                    try {
                        const pandocPath = await store.get('pandocPath');
                        const contentForPandoc = rawMarkdownText.replace(/\n/g, '  \n');

                        await invoke('export_with_pandoc', {
                            sourceContent: contentForPandoc,
                            outputPath: path,
                            format: "docx",
                            isVertical: false,
                            pandocPathSetting: pandocPath || null,
                            metadata: {}
                        });

                        alert(t('export.alert.docxSuccess'));
                    } catch (e) {
                        console.error(e);
                        alert(`${t('export.alert.docxFailed')}:\n${e}`);
                    }
                }
            });

            // --- EPUB保存 ---
            document.getElementById('btn-epub')?.addEventListener('click', async () => {
                epubTitleInput.value = "";
                epubModal.style.display = 'flex';
            });

            // --- 表紙画像選択 ---
            document.getElementById('btn-select-cover')?.addEventListener('click', async () => {
                const path = await open({
                    filters: [{ name: 'Image', extensions: ['jpg', 'jpeg', 'png'] }]
                });
                if (path) epubCoverPathInput.value = path;
            });

            document.getElementById('btn-clear-cover')?.addEventListener('click', () => {
                epubCoverPathInput.value = "";
            });

            // --- キャンセル ---
            document.getElementById('btn-cancel-epub')?.addEventListener('click', () => {
                epubModal.style.display = 'none';
            });

            // --- 実行 (保存) ---
            document.getElementById('btn-exec-epub')?.addEventListener('click', async () => {
                const title = epubTitleInput.value || "Untitled";
                const author = epubAuthorInput.value || "Author";
                const coverPath = epubCoverPathInput.value || null;

                epubModal.style.display = 'none';

                const path = await save({
                    defaultPath: title + ".epub",
                    filters: [{ name: 'EPUB Book', extensions: ['epub'] }]
                });

                if (path && contentDiv) {
                    const fileName = path.split(/[/\\]/).pop() || 'Untitled';
                    const epubTitle = fileName.replace(/\.[^/.]+$/, "");

                    const rawHtml = contentDiv.innerHTML;
                    const lines = rawHtml.split(/<br\s*\/?>/i);

                    const sections = [];
                    let currentSection = { title: epubTitle, content: "" };
                    let isFirstSectionEmpty = true;

                    lines.forEach((line) => {
                        const cleanLine = line.trim();
                        const match = cleanLine.match(/^(#+)\s+(.*)/);

                        if (match) {
                            if (!isFirstSectionEmpty || currentSection.content.trim() !== "") {
                                sections.push(currentSection);
                            }

                            const level = match[1].length;
                            const headingText = match[2];

                            currentSection = {
                                title: headingText,
                                content: `<h${level}>${headingText}</h${level}>`
                            };
                            isFirstSectionEmpty = false;

                        } else {
                            if (cleanLine !== "") {
                                currentSection.content += `<p>${line}</p>`;
                            }
                        }
                    });

                    if (currentSection.content.trim() !== "") {
                        sections.push(currentSection);
                    }

                    const sanitizedSections = sections.map(sec => {
                        return {
                            title: sec.title,
                            content: sec.content
                                .replace(/&nbsp;/g, '&#160;')
                                .replace(/<hr>/g, '<hr />')
                        };
                    });

                    try {
                        await invoke('export_epub', {
                            path,
                            title: epubTitle,
                            author,
                            coverPath,
                            sections: sanitizedSections,
                        });
                        alert(t('export.alert.epubSuccess'));
                    } catch (e) {
                        console.error(e);
                        alert(`${t('export.alert.epubFailed')}: ${e}`);
                    }
                }
            });


            // 閉じる
            document.getElementById('btn-close')?.addEventListener('click', () => getCurrentWindow().close());

            // ショートカット
            document.addEventListener('keydown', (e) => {
                const isCtrlOrCmd = e.ctrlKey || e.metaKey;
                const key = e.key.toLowerCase();
                if (isCtrlOrCmd && e.key.toLowerCase() === 'p') {
                    e.preventDefault();
                    window.print();
                }
                if (isCtrlOrCmd && e.key.toLowerCase() === 'e') {
                    e.preventDefault();
                    getCurrentWindow().close();
                }
                if (isCtrlOrCmd && key === 'r') { e.preventDefault(); }
                if (isCtrlOrCmd && key === 'r' && e.shiftKey) { e.preventDefault(); }
            });

            // --- 右クリックメニューの無効化 ---
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            });
        }
        window.addEventListener('DOMContentLoaded', initExport);
    </script>
</body>

</html>
