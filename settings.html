<!-- settings.html -->
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設定</title>
    <link rel="stylesheet" href="/src/settings.css">
</head>

<body>
    <div id="settings-wrapper">
        <div data-tauri-drag-region class="settings-titlebar">
            <div data-tauri-drag-region class="settings-window-controls">
                <button id="settings-btn-close" title="閉じる (F2)"></button>
            </div>
        </div>
        <div data-tauri-drag-region id="settings-container">
            <div class="tabs">
                <button class="tab-btn active" data-tab="tab-general">一般</button>
                <button class="tab-btn" data-tab="tab-ai">AI設定</button>
                <button class="tab-btn" data-tab="tab-code">コードエディタ</button>
                <hr class="separator" style="color: transparent;border: none;">
                <button id="save-settings-btn">適用</button>
            </div>
            <!-- ===== タブ1: 一般設定 ===== -->
            <div id="tab-general" class="tab-content active">

                <div class="setting-item">
                    <label style="display: flex; gap: 10px; align-items: center;">エディタの最大幅 (半角文字数):
                        <!-- ★ type="number" に変更 -->
                        <input type="number" id="editor-width-input" min="20" max="200" step="1">
                        <p class="setting-note">※0を入力するとウィンドウ幅に追従します。
                        </p>
                    </label>
                    <label for="line-height-input">行の高さ:</label>
                    <input type="number" id="line-height-input" min="1.0" max="3.0" step="0.1">
                </div>
                <div class="setting-item">
                    <label for="editor-padding-x">エディタ左右余白:</label>
                    <input type="number" id="editor-padding-x" min="0" max="200" step="1">
                    <span style="margin-left: 5px;">px</span>
                </div>
                <div class="setting-item">
                    <label for="line-break-select">禁則処理:</label>
                    <select id="line-break-select">
                        <option value="normal">標準</option>
                        <option value="strict">厳格</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>背景画像:</label>
                    <button id="btn-select-bg-image">Select</button>
                    <button id="btn-clear-bg-image">Default</button>
                    <button id="btn-none-bg-image">なし</button>
                    <span id="current-bg-image-path"></span>
                </div>
                <div class="setting-item">
                    <label>BGM:</label>
                    <button id="btn-select-bgm">Select</button>
                    <button id="btn-clear-bgm">Default</button>
                    <span id="current-bgm-path"></span>
                </div>
                <div class="setting-item">
                    <label for="word-break-select">折り返し設定:</label>
                    <select id="word-break-select">
                        <option value="break-all">文字単位 (日本語向け)</option>
                        <option value="normal">単語単位 (英語向け)</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="font-family-select">フォント:</label>
                    <select id="font-family-select"></select>
                </div>
                <div class="setting-item">
                    <label style="display: flex; gap: 5px;">Pandoc Path(縦書きエクスポートに必要):
                        <input type="text" id="pandoc-path" style="flex-grow: 1;margin: auto;"
                            placeholder="例：C:\Program Files\Pandoc\pandoc.exe"></input>
                        <button id="btn-select-pandoc" style="margin: auto;">参照...</button>
                    </label>
                </div>

                <hr>
                <h3>エディタ外観</h3>
                <div class="setting-item">
                    <label>配置:</label>
                    <select id="editor-align-select">
                        <option value="center">中央 (デフォルト)</option>
                        <option value="left">左寄せ</option>
                        <option value="right">右寄せ</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label>すりガラス強度 (Blur):</label>
                    <input type="range" id="editor-blur-range" min="0" max="20" value="0">
                    <span id="blur-val">0px</span>
                </div>

                <div class="setting-item">
                    <div style="display: flex; gap: 10px; align-items: center;margin-bottom: 5px;">
                        <label for="picker-text-color">文字色</label>
                        <div id="picker-text-color" class="color-preview"></div>
                        <input type="text" id="input-text-color" style="flex-grow: 1;" placeholder="#1e1e1e" />
                        <label for="picker-window-bg">ウィンドウ背景色</label>
                        <div id="picker-window-bg" class="color-preview"></div>
                        <input type="text" id="input-window-bg" style="flex-grow: 1;" placeholder="#ffffff" />
                    </div>

                    <div style="display: flex; gap: 10px; align-items: center;margin-bottom: 5px;">
                        <label for="picker-ui-text-color">UI文字色</label>
                        <div id="picker-ui-text-color" class="color-preview"></div>
                        <input type="text" id="input-ui-text-color" style="flex-grow: 1;" placeholder="#1e1e1e" />
                        <label for="picker-editor-bg">エディタ背景色</label>
                        <div id="picker-editor-bg" class="color-preview"></div>
                        <input type="text" id="input-editor-bg" style="flex-grow: 1;"
                            placeholder="rgba(255, 255, 255, 0)" />
                    </div>

                    <div style="display: flex; gap: 10px; align-items: center;margin-bottom: 5px;">
                        <label for="picker-selection-color">選択色</label>
                        <div id="picker-selection-color" class="color-preview"></div>
                        <input type="text" id="input-selection-color" style="flex-grow: 1;" placeholder="#1e1e1e" />
                        <label for="picker-scrollbar-color">スクロールバー色</label>
                        <div id="picker-scrollbar-color" class="color-preview"></div>
                        <input type="text" id="input-scrollbar-color" style="flex-grow: 1;"
                            placeholder="rgba(255, 255, 255, 0)" />
                    </div>

                    <div style="display: flex; gap: 10px; align-items: center;margin-bottom: 5px;">
                        <label for="picker-heading-color">見出し色</label>
                        <div id="picker-heading-color" class="color-preview"></div>
                        <input type="text" id="input-heading-color" style="flex-grow: 1;" placeholder="#0550AE" />
                        <label for="picker-glow-color">グロー色:</label>
                        <div id="picker-glow-color" class="color-preview"></div>
                        <input type="text" id="input-glow-color" style="flex-grow: 1;"
                            placeholder="rgba(0, 255, 65, 0.5)" />
                    </div>
                </div>

                <div class="setting-item">
                    <label for="unified-theme-select">テーマプリセット</label>
                    <select id="unified-theme-select">
                        <optgroup label="System Presets" id="system-presets-group">
                            <option value="sys:default">Default (White)</option>
                            <option value="sys:paper">Paper (Sepia)</option>
                            <option value="sys:cyber">Cyber (Matrix Green)</option>
                            <option value="sys:tokyo">Tokyo Night</option>
                            <option value="sys:depth">Glowing Depth</option>
                        </optgroup>
                        <optgroup label="User Themes" id="user-themes-group">
                            <!-- ここに動的に追加される -->
                        </optgroup>
                    </select>
                    <button id="btn-reset-custom">Reset</button>
                    <button id="btn-save-user-theme">Save</button>
                    <button id="btn-delete-user-theme">Delete</button>
                </div>

                <div class="setting-item">
                    <div style="display: flex; gap: 10px; align-items: center;margin-bottom: 5px;">
                        <input type="checkbox" id="check-enable-glow"> グロー
                        <label for="input-glow-radius">強さ: <span id="glow-radius-val">5px</span></label>
                        <input type="range" id="input-glow-radius" min="1" max="10" step="1" value="5" />
                        <input type="checkbox" id="use-ui-bg"> サイドバー等にも背景を適用
                    </div>
                </div>
            </div>
            <!-- タブ2: AI設定 -->
            <div id="tab-ai" class="tab-content">
                <div class="ai-setting-group">
                    <h4>Cloud AI (Gemini / Groq)</h4>

                    <!-- Gemini設定 -->
                    <label style="display: flex; gap: 5px;">
                        Gemini API Key
                        <input type="password" id="gemini-api-key" placeholder="AIzaSy..."
                            style="flex-grow: 1;margin: auto;" />
                    </label>
                    <label style="display: flex; gap: 5px;">
                        Gemini Model
                        <input type="text" id="gemini-model" placeholder="<モデル名を入力>"
                            style="flex-grow: 1;margin: auto;" />
                        <select id="gemini-model-preset" style="flex-grow: 0;margin: auto;"
                            onchange="document.getElementById('gemini-model').value = this.value;">
                            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                            <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                            <option value="">手動入力</option>
                        </select>
                    </label>

                    <hr style="margin: 10px 0; border: 0; border-top: 1px solid var(--ui-text-color); opacity: 0.3;">

                    <!-- Groq設定 -->
                    <label style="display: flex; gap: 5px;">
                        Groq API Key
                        <input type="password" id="groq-api-key" placeholder="gsk_..."
                            style="flex-grow: 1;margin: auto;" />
                    </label>
                    <label style="display: flex; gap: 5px;">
                        Groq Model
                        <input type="text" id="groq-model" placeholder="<モデル名を入力>" style="flex-grow: 1;margin: auto;" />
                        <select id="groq-model-preset" style="flex-grow: 0;margin: auto;"
                            onchange="document.getElementById('groq-model').value = this.value;">
                            <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
                            <option value="moonshotai/kimi-k2-instruct-0905">Kimi K2</option>
                            <option value="openai/gpt-oss-120b">GPT OSS 120B</option>
                            <option value="">手動入力</option>
                        </select>
                    </label>
                </div>

                <div class="ai-setting-group">
                    <h4>Local LLM</h4>
                    <label style="display: flex; gap: 5px;">
                        Endpoint URL
                        <input type="text" id="local-llm-url" placeholder="http://127.0.0.1:1234/v1/chat/completions"
                            style="flex-grow: 1;margin: auto;" />
                        <select id="local-llm-url-preset" style="flex-grow: 0;margin: auto;"
                            onchange="document.getElementById('local-llm-url').value = this.value;">
                            <!-- LM Studio Default -->
                            <option value="http://127.0.0.1:1234/v1/chat/completions">LM Studio (Default)</option>
                            <!-- Ollama Default -->
                            <option value="http://127.0.0.1:11434/v1/chat/completions">Ollama (Default)</option>
                            <!-- koboldcpp Default -->
                            <option value="http://localhost:5001/v1/chat/completions">koboldcpp (Default)</option>
                            <option value="">手動入力</option>
                        </select>
                    </label>
                    <label style="display: flex; gap: 5px;">
                        Model Name (Required for Ollama)
                        <input type="text" id="local-llm-model" placeholder="※LM Studioの場合は無視されます"
                            style="flex-grow: 1;margin: auto;" />
                    </label>
                </div>

                <div class="ai-setting-group">
                    <h4>Behavior</h4>
                    <label>
                        最大応答長(100〜100000):
                        <input type="number" id="ai-max-tokens" placeholder="2000" min="100" max="100000"
                            style="width: 60px;" /><br>
                        AI連想機能応答長(10〜1000):
                        <input type="number" id="fa-max-tokens" placeholder="30" min="10" max="1000"
                            style="width: 40px;" />
                        <br />
                        コンテキスト長(1000〜100000):
                        <input type="number" id="ai-context-limit" placeholder="2000" min="1000" max="100000"
                            style="width: 60px;" />
                        <input type="checkbox" id="check-ai-thinking-overlay" checked />
                        AI思考時の演出
                        <span style="font-size: 0.7em; color: #111;"><br>
                            ※ローカルAIに渡す文脈の長さ。通常は2000～3000程度を推奨<br>
                            ※Geminiは設定にかかわらず最大4000になります。<br>
                            ※この値＋システムプロンプトの長さが使用モデルの最大コンテクスト長を越えるとエラーになります<div class=""></div>
                        </span><br>
                    </label>
                    <label>
                        System Prompt (AIへの役割指示):
                        <textarea id="ai-system-prompt" class="setting-textarea"
                            placeholder="あなたは優秀な執筆アシスタントです..."></textarea>
                    </label>
                </div>

                <div class="ai-setting-group">
                    <h4>User Profile</h4>
                    <label style="display: flex; gap: 5px;">
                        Name
                        <input type="text" id="user-name" placeholder="User" style="flex-grow: 1;margin: auto;" />
                    </label>
                    <div class="file-select-row">
                        <span>Icon:</span>
                        <span id="user-icon-path" class="path-display"
                            style="font-size: 0.8em; color: #111;">(Default)</span>
                        <button id="btn-select-user-icon">Select</button>
                        <button id="btn-clear-user-icon">Clear</button>
                    </div>
                </div>

                <div class="ai-setting-group">
                    <h4>AI Profile</h4>
                    <label style="display: flex; gap: 5px;">
                        Name
                        <input type="text" id="ai-name" placeholder="AI" style="flex-grow: 1;margin: auto;" />
                    </label>
                    <div class="file-select-row">
                        <span>Icon:</span>
                        <span id="ai-icon-path" class="path-display"
                            style="font-size: 0.8em; color: #111;">(Default)</span>
                        <button id="btn-select-ai-icon">Select</button>
                        <button id="btn-clear-ai-icon">Clear</button>
                    </div>
                </div>
            </div>
            <!-- タブ3: コードエディタ設定 -->
            <div id="tab-code" class="tab-content">
                <div class="setting-group">
                    <h4>Code Editor Settings</h4>
                    <label>
                        Syntax Highlight Language:
                        <select id="code-language-select">
                            <option value="html">HTML</option>
                            <option value="css">CSS</option>
                            <option value="javascript">JavaScript / TypeScript</option>
                            <option value="markdown">Markdown</option>
                            <option value="rust">Rust</option>
                            <option value="python">Python</option>
                            <!-- 必要なら他も追加 -->
                        </select>
                    </label>
                    <label style="display: flex; gap: 5px;">Font:
                        <select id="code-font-family-select" style="flex-grow: 1;margin: auto;"></select>
                    </label>
                    <label style="display: flex; gap: 5px;">Font Size:
                        <input type="number" id="code-font-size-input" min="8" max="72" value="14"
                            style="width: 60px;" />
                    </label>
                    <label style="display: flex; gap: 5px;">Word Wrap (折り返し)
                        <input type="checkbox" id="code-line-wrapping" />
                    </label>
                </div>

                <div class="setting-group">
                    <h4>Markdown Preview</h4>
                    <label>
                        <input type="checkbox" id="check-md-hard-breaks" />
                        Hard Breaks (Enter1回で改行する)
                    </label>
                    <p style="font-size: 0.8em; color: #333; margin-top: 5px;">
                        ※オフの場合、公式Markdown仕様通り「末尾に半角スペース2つ」か「空行」で改行されます（Astro等でのプレビュー時はオフ推奨）。
                    </p>
                </div>

                <div class="setting-group">
                    <h4>Terminal Settings</h4>
                    <label style="display: flex; gap: 5px;">Shell Path:
                        <input type="text" id="shell-path" style="flex-grow: 1;margin: auto;"
                            placeholder="(Auto Detect)" />
                        <button id="btn-select-shell" style="margin: auto;">参照...</button>
                    </label>
                    <label style="display: flex; gap: 5px;">Startup Directory:
                        <input type="text" id="terminal-cwd" style="flex-grow: 1;margin: auto;"
                            placeholder="(User Home)" />
                        <button id="btn-select-cwd" style="margin: auto;">参照...</button>
                    </label>
                </div>

            </div>
        </div>
    </div>
    <script type="module" src="/src/settings.ts"></script>
</body>

</html>
