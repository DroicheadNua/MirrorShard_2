[package]
name = "mirrorshard2"
version = "1.13.0"
description = "A minimal markdown editor for creative writing."
authors = ["DroicheadNua"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mirrorshard_ver02_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["devtools", "protocol-asset", "macos-private-api"] }
rig-core = "0.36.0"
tokio = { version = "1.52.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
font-kit = "0.14.3"
epub-builder = "0.8"
opener = "0.8.4"
portable-pty = "0.9"
zip = "8.3.0"
regex = "1.12.3"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
thiserror = "1.0"
urlencoding = "2.1.3"
reqwest = { version = "0.13.4", features = ["json"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "minimp3", "hound", "lewton"] } # symphoniaが有効だとoggが再生できないバグの回避策

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
encoding_rs = "0.8"
tauri-plugin-single-instance = "2"
tauri-plugin-cli = "2"

[profile.release]
opt-level = "z" # サイズ優先
lto = true
codegen-units = 1
strip = true
